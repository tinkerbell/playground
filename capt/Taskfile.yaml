version: "3"

# Apply bash-style strict mode to every `cmds:` block in this Taskfile.
# Replaces the per-task `set -euo pipefail` heredoc preamble.
# https://taskfile.dev/docs/reference/schema#set-options
set: [errexit, nounset, pipefail]

includes:
  create: ./tasks/Taskfile-create.yaml
  delete: ./tasks/Taskfile-delete.yaml
  vbmc: ./tasks/Taskfile-vbmc.yaml
  capi: ./tasks/Taskfile-capi.yaml
  capi-pivot: ./tasks/Taskfile-capi-pivot.yaml
  helm: ./tasks/Taskfile-helm.yaml
  tools: ./tasks/Taskfile-tools.yaml
  nat64: ./tasks/Taskfile-nat64.yaml
  network: ./tasks/Taskfile-network.yaml
  source: ./tasks/Taskfile-source.yaml
  registry: ./tasks/Taskfile-registry.yaml

env:
  # By default, prepend ./bin so the pinned downloaded tools resolve as bare
  # command names. USE_PATH_BINARIES=true retains PATH and skips those
  # downloads in tools:install-binaries.
  # TASK_X_ENV_PRECEDENCE=1 (set in .env) lets this override the OS PATH.
  PATH: '{{if eq (env "USE_PATH_BINARIES") "true"}}{{env "PATH"}}{{else}}{{.ROOT_DIR}}/bin:{{env "PATH"}}{{end}}'
  # Puts both kind clusters on the playground's own network instead of the
  # shared one named `kind`, so it can be torn down with everything else.
  KIND_EXPERIMENTAL_DOCKER_NETWORK: "{{.NETWORK_NAME}}"

vars:
  # Paths to the playground's config and state file. Both are overridable so a
  # caller can drive a playground from its own pair of files rather than the
  # ones at the repo root, which every invocation would otherwise share: the
  # e2e runner gives each combo a config and state of its own. A relative
  # value resolves against the Taskfile directory.
  CONFIG_FILE: "config.yaml"
  CONFIG_FILE_FQ_PATH: '{{if hasPrefix "/" .CONFIG_FILE}}{{.CONFIG_FILE}}{{else}}{{joinPath .ROOT_DIR .CONFIG_FILE}}{{end}}'
  STATE_FILE: ".state"
  STATE_FILE_FQ_PATH: '{{if hasPrefix "/" .STATE_FILE}}{{.STATE_FILE}}{{else}}{{joinPath .ROOT_DIR .STATE_FILE}}{{end}}'
  # Identifies this playground among however many share the host, so their
  # docker networks, KinD clusters and libvirt domains stay distinct. Hashing
  # the state file's path means the identity needs no registry and no
  # allocation: it is stable across re-runs because the path is, and distinct
  # because two playgrounds already need two state files. -m resolves a path
  # that does not exist yet, which is the case on the first create.
  INSTANCE_ID:
    sh: printf '%s' "$(realpath -m {{.STATE_FILE_FQ_PATH}})" | sha256sum | cut -c1-8
  # Resolved once, when task starts -- so on a first create these cannot read
  # .state, which does not exist yet. scripts/state_value.sh reads it when it
  # is there and asks cue for the same field when it is not.
  OUTPUT_DIR:
    sh: "{{.ROOT_DIR}}/scripts/state_value.sh {{.CONFIG_FILE_FQ_PATH}} {{.STATE_FILE_FQ_PATH}} {{.INSTANCE_ID}} outputDir"
  NETWORK_NAME:
    sh: "{{.ROOT_DIR}}/scripts/state_value.sh {{.CONFIG_FILE_FQ_PATH}} {{.STATE_FILE_FQ_PATH}} {{.INSTANCE_ID}} names.network"
  # Tags every `cue export ./cue/state` needs, wherever it runs. The state file
  # is rendered twice -- once before the network exists and again with what it
  # supplies -- and the second render replaces the first, so a tag missing from
  # either one silently empties whatever it fed.
  #
  # The command substitutions are not run when this is resolved: it is a plain
  # template, and the shell expands them when the command runs. That is what
  # lets it read files a task's deps create.
  STATE_TAGS: >-
    -t cwd="$PWD"
    -t instanceID="{{.INSTANCE_ID}}"
    -t sshPubKey="$(tr -d '\n' < {{.OUTPUT_DIR}}/capt-ssh-key.pub)"
    -t sourceRepo="$(yq eval '.repo // ""' {{.OUTPUT_DIR}}/source.yaml 2>/dev/null || true)"
    -t sourceDir="$(yq eval '.dir // ""' {{.OUTPUT_DIR}}/source.yaml 2>/dev/null || true)"
    -t sourceCommit="$(yq eval '.commit // ""' {{.OUTPUT_DIR}}/source.yaml 2>/dev/null || true)"
    -t sourceVersion="$(yq eval '.version // ""' {{.OUTPUT_DIR}}/source.yaml 2>/dev/null || true)"
    -t sourceDirty="$(yq eval '.dirty // false' {{.OUTPUT_DIR}}/source.yaml 2>/dev/null || echo false)"
  # sushy-tools attaches virtual media from a libvirt pool whose name is a
  # class attribute in its libvirt driver -- STORAGE_POOL = 'default', with no
  # config key to override it. So the playground has to use libvirt's
  # conventional pool, and must be careful with it: pool_release.sh only
  # removes it once no playground is left, and only if the playground created
  # it, because on a machine that uses libvirt for anything else this is
  # somebody's real pool.
  STORAGE_POOL: default
  STORAGE_POOL_DIR: /tmp/capt-playground-iso
  # Carries locally built images when a playground is built from source. Two
  # addresses for the one registry: pushes go to the published host port, which
  # is the same wherever the build runs and which docker and buildkit both treat
  # as insecure without configuration; pulls use its address on each
  # playground's network, which is the only one the machines can reach. The
  # repository path is the same either way, so nothing is retagged.
  REGISTRY_IMAGE: docker.io/library/registry:3
  REGISTRY_PORT: "5010"
  REGISTRY_CONTAINER_PORT: "5000"
  REGISTRY_ENDPOINT: "127.0.0.1:{{.REGISTRY_PORT}}"
  # Pinned tool versions for binaries downloaded into ./bin from each upstream
  # project's release artifacts. Bump these to upgrade tooling; the
  # install-binaries task is idempotent on the version string.
  CUE_VERSION: v0.16.1
  HELM_VERSION: v4.1.4
  KIND_VERSION: v0.31.0
  # clusterctl version pins to the CAPI core release; must be compatible with
  # the providers `clusterctl init` will install.
  CLUSTERCTL_VERSION: v1.12.5
  KUBECTL_VERSION: v1.35.4
  YQ_VERSION: v4.53.2
  # Host OS/arch used to construct release download URLs. Override on the
  # command line if cross-installing (e.g. `task install-binaries OS=darwin`).
  OS:
    sh: uname -s | tr '[:upper:]' '[:lower:]'
  ARCH:
    sh: case "$(uname -m)" in x86_64) echo amd64;; aarch64|arm64) echo arm64;; *) uname -m;; esac

tasks:
  create-playground:
    silent: true
    summary: |
      Create the CAPT playground. Use the config.yaml file to define things like cluster size and Kubernetes version.
    cmds:
      - task: system-deps-warnings
      - task: tools:validate-binaries
      - task: tools:install-binaries
      # Before network:create: the network's name comes from the state file,
      # and generate-state needs nothing the network provides.
      - task: generate-state
      - task: network:create
      - task: create:playground-ordered
      - task: next-steps

  delete-playground:
    silent: true
    summary: |
      Delete the CAPT playground.
    cmds:
      - task: tools:validate-binaries
      - task: tools:install-binaries
      - task: delete:playground

  instances:
    silent: true
    summary: |
      List the playgrounds running on this host, and the services they share.

      Read back off the docker networks' labels, so it is right even for a
      playground whose state file was lost.
    cmds:
      - "{{.ROOT_DIR}}/scripts/instances.sh"

  system-deps-warnings:
    summary: |
      Run CAPT playground system warnings.
    silent: true
    cmds:
      - echo "Please ensure you have the following:"
      - echo "60GB of free and very fast disk space (etcd is very disk I/O sensitive)"
      - echo "8GB of free RAM"
      - echo "4 CPU cores"

  ensure-output-dir:
    summary: |
      Create the output directory.
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - mkdir -p {{.OUTPUT_DIR}}/xdg
    status:
      - echo ;[ -d {{.OUTPUT_DIR}} ]
      - echo ;[ -d {{.OUTPUT_DIR}}/xdg ]

  generate-ssh-key:
    summary: |
      Generate an ed25519 SSH keypair in {{.OUTPUT_DIR}} for cloud-init
      authorized_keys injection.
    deps: [ensure-output-dir]
    generates:
      - "{{.OUTPUT_DIR}}/capt-ssh-key"
      - "{{.OUTPUT_DIR}}/capt-ssh-key.pub"
    cmds:
      - ssh-keygen -t ed25519 -f {{.OUTPUT_DIR}}/capt-ssh-key -N "" -C capt-playground >/dev/null
    status:
      - test -f {{.OUTPUT_DIR}}/capt-ssh-key
      - test -f {{.OUTPUT_DIR}}/capt-ssh-key.pub

  generate-state:
    summary: |
      Populate the state file from the config using the cue/state package.
      Reads the SSH public key generated by generate-ssh-key, and the resolved
      commit written by source:prepare when building from source.
    deps: [generate-ssh-key, source:prepare]
    sources:
      - "{{.CONFIG_FILE_FQ_PATH}}"
      - cue/state/*.cue
      - cue/values/*.cue
      - cue/mirror/*.cue
      - "{{.OUTPUT_DIR}}/capt-ssh-key.pub"
      # A moving ref resolves to a new commit without anything else changing,
      # and the state file has to follow it.
      - "{{.OUTPUT_DIR}}/source.yaml"
    generates:
      - "{{.STATE_FILE_FQ_PATH}}"
    cmds:
      # Validate the config against the cue/state schema (and transitively
      # cue/values + cue/mirror) before exporting. Surfaces schema errors
      # before they appear as confusing yaml-export failures.
      # Folded scalar (>-) is required because the bare `yaml:` token would
      # otherwise be parsed as a YAML mapping key.
      - >-
        cue vet ./cue/state yaml: {{.CONFIG_FILE_FQ_PATH}} -l 'config:' {{.STATE_TAGS}}
      - >-
        cue export ./cue/state yaml: {{.CONFIG_FILE_FQ_PATH}} -l 'config:' {{.STATE_TAGS}}
        -e out --out yaml > {{.STATE_FILE_FQ_PATH}}

  next-steps:
    silent: true
    summary: |
      Next steps after creating the CAPT playground.
    vars:
      NAMESPACE:
        sh: yq eval '.namespace' {{.STATE_FILE_FQ_PATH}}
      NODE_BASE:
        sh: yq eval '.vm.baseName' {{.STATE_FILE_FQ_PATH}}
      CLUSTER_NAME:
        sh: yq eval '.clusterName' {{.STATE_FILE_FQ_PATH}}
      # state.cue resolves outputDir to an absolute path, so the commands
      # printed below do not depend on where the reader runs them -- and do
      # not need ROOT_DIR glued on, which doubled the prefix whenever
      # config.yaml already held an absolute outputDir.
      OUTPUT_DIR_ABS:
        sh: yq eval '.outputDir' {{.STATE_FILE_FQ_PATH}}
      WORKLOAD_KUBECONFIG: "{{.OUTPUT_DIR_ABS}}/{{.CLUSTER_NAME}}.kubeconfig"
      KIND_KUBECONFIG:
        sh: yq eval '.kind.kubeconfig' {{.STATE_FILE_FQ_PATH}}
      EXTERNAL_TINKERBELL:
        sh: yq eval '.externalTinkerbell // false' {{.STATE_FILE_FQ_PATH}}
      TINK_KUBECONFIG:
        sh: yq eval '.kind.tinkerbell.kubeconfig // ""' {{.STATE_FILE_FQ_PATH}}
    cmds:
      - |
        echo
        echo The workload cluster is now being created.
        echo Once the cluster nodes are up and running, you will need to deploy a CNI for the cluster to be fully functional.
        echo The management cluster kubeconfig is located at: {{.KIND_KUBECONFIG}}
        {{- if eq .EXTERNAL_TINKERBELL "true" }}
        echo The Tinkerbell cluster kubeconfig is located at: {{.TINK_KUBECONFIG}}
        echo "NOTE: External Tinkerbell mode is enabled. Tinkerbell resources (Hardware, Workflows, BMC) are in the Tinkerbell cluster."
        {{- end }}
        echo The workload cluster kubeconfig is located at: {{.WORKLOAD_KUBECONFIG}}
        echo
        echo 1. Watch and wait for the first control plane node to be provisioned successfully: STATE_SUCCESS
        {{- if eq .EXTERNAL_TINKERBELL "true" }}
        echo "KUBECONFIG={{.TINK_KUBECONFIG}} kubectl get workflows -n {{.NAMESPACE}} -o wide -w"
        {{- else }}
        echo "KUBECONFIG={{.KIND_KUBECONFIG}} kubectl get workflows -n {{.NAMESPACE}} -o wide -w"
        {{- end }}
        echo
        echo
        echo 2. Watch and wait for the Kubernetes API server to be ready and responding:
        echo "until KUBECONFIG={{.WORKLOAD_KUBECONFIG}} kubectl get node; do echo 'Waiting for Kube API server to respond...'; sleep 5; done"
        echo
        echo 3. Deploy a CNI
        echo Cilium
        echo "KUBECONFIG={{.WORKLOAD_KUBECONFIG}} cilium install"
        echo or KUBEROUTER
        echo "{{.ROOT_DIR}}/scripts/deploy_cni.sh {{.STATE_FILE_FQ_PATH}} {{.WORKLOAD_KUBECONFIG}}"
        echo
        echo 4. Watch and wait for all nodes to join the cluster and be ready:
        echo "KUBECONFIG={{.WORKLOAD_KUBECONFIG}} kubectl get nodes -w"
      - touch {{.OUTPUT_DIR_ABS}}/.next-steps-displayed
    status:
      - echo ;[ -f {{.OUTPUT_DIR_ABS}}/.next-steps-displayed ]

  pivot:
    silent: true
    summary: |
      Pivot the workload cluster to the permanent management cluster.
    cmds:
      - task: capi-pivot:ordered
