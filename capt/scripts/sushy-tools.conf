import os

# '::' rather than '0.0.0.0' so the Redfish emulator is reachable from
# IPv6-only rufio pods. With net.ipv6.bindv6only=0 (the Linux default) this
# socket still accepts IPv4, so ipv4 playgrounds are unaffected.
SUSHY_EMULATOR_LISTEN_IP = u'::'
SUSHY_EMULATOR_LISTEN_PORT = 443
SUSHY_EMULATOR_OS_CLOUD = None
SUSHY_EMULATOR_LIBVIRT_URI = u'qemu:///system'
SUSHY_EMULATOR_IGNORE_BOOT_DEVICE = False
SUSHY_EMULATOR_FEATURE_SET = u'full'
SUSHY_EMULATOR_AUTH_FILE = u'/etc/sushy/htpasswd'
SUSHY_EMULATOR_SSL_CERT = u'/etc/sushy/sushy.cert'
SUSHY_EMULATOR_SSL_KEY = u'/etc/sushy/sushy.key'
# libvirtd runs on the host and resolves these paths there, so the container is
# handed host paths rather than the firmware itself.
_ovmf_code = os.environ.get('OVMF_CODE', u'/usr/share/OVMF/OVMF_CODE.fd')
_ovmf_vars = os.environ.get('OVMF_VARS', u'/usr/share/OVMF/OVMF_VARS.fd')

SUSHY_EMULATOR_BOOT_LOADER_MAP = {
    u'UEFI': {
        u'x86_64': _ovmf_code
    },
    u'Legacy': {
        u'x86_64': None
    }
}
# sushy-tools discards and rebuilds <loader> and <nvram> every time it sets UEFI
# boot mode, so the nvram template has to be overridden alongside the loader.
SUSHY_EMULATOR_SECURE_BOOT_DISABLED_NVRAM = _ovmf_vars
SUSHY_EMULATOR_VMEDIA_DEVICES = {
    u'Cd': {
        u'Name': 'Virtual CD',
        u'MediaTypes': [
            u'CD',
            u'DVD'
        ]
    }
}
